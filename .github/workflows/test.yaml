name: Test

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false # avoid cache poisoning on release runs

      - name: Install dependencies
        run: uv sync --locked

      - name: Test
        run: uv run pytest -m "not integration"

  integration:
    name: Integration tests (LocalNet)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false # avoid cache poisoning on release runs

      - name: Install dependencies
        run: uv sync --locked

      - name: Start LocalNet
        run: |
          uvx algokit@2.10.2 localnet start
          curl --silent --fail --retry 30 --retry-all-errors --retry-delay 2 http://localhost:4001/health
          curl --silent --fail --retry 30 --retry-all-errors --retry-delay 2 http://localhost:8980/health

      - name: Test
        run: uv run pytest -m integration
