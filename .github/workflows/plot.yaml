name: Update plots

on:
  schedule:
    - cron: "42 0 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  plots:
    name: PPoS Dex Plots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # force-pushes the generated images to the `images` branch

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked] needed to push, no artifacts uploaded

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Save timeseries
        run: uv run --no-sync python ppos_dex.py timeseries --save

      - name: Save snapshots
        run: uv run --no-sync python ppos_dex.py snapshot --save

      - name: Push images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create images
          if [ -z "$(git status --porcelain)" ]; then
            echo "No image changes - skipping"
            exit 0
          fi
          git commit --all --message "refreshed images 🤖"
          git push --force origin images
