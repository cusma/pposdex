[project]
name = "pposdex"
version = "3.0.0"
description = "Algorand Pure Proof of Stake Decentralization Index"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "cusma", email = "cosimo.bassi@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10",
    "msgpack>=1.0",
    "py-algorand-sdk>=2.12,<3",
]

[project.scripts]
pposdex = "pposdex.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pre-commit>=4.3",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "N", "C4", "PL"]
ignore = [
    "PLR2004", # magic values are domain constants here
    "PLR0913", # plotting and index functions take many explicit parameters
    "PLR0917",
]

[tool.mypy]
python_version = "3.12"
strict = true
# py-algorand-sdk ships type hints, but many of its functions are unannotated
untyped_calls_exclude = ["algosdk"]
# Test folders are not packages: name their modules from these roots
mypy_path = ["src", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["msgpack"]
ignore_missing_imports = true

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
# Integration tests need a running LocalNet: run them with `pytest -m integration`
addopts = ["-ra", "--import-mode=importlib", "-m", "not integration", "--cov"]
strict = true
filterwarnings = ["error"]
markers = ["integration: requires a running AlgoKit LocalNet"]

[tool.coverage.run]
source = ["pposdex"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']
